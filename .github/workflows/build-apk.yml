name: Build Door DNA AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Create package.json
        run: |
          cat > package.json <<'EOF'
          {
            "name": "door-dna-ai",
            "version": "1.0.0",
            "private": true
          }
          EOF

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.doordnaai.app",
            "appName": "Door DNA AI",
            "webDir": "www"
          }
          EOF

      - name: Install Capacitor
        run: |
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Door-DNA-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
