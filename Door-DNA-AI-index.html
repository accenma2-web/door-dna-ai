<!doctype html><html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0d10"><title>Door DNA AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#f8f8f5;font-family:Arial,Tahoma,sans-serif}.app{max-width:560px;margin:auto;padding:18px 15px 35px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center}.brand{color:#d7b56d;font-size:22px;font-weight:900;letter-spacing:2px}.sub{color:#a9b0bb;font-size:11px;margin-top:4px}.demo{border:1px solid #d7b56d;color:#d7b56d;padding:5px 9px;border-radius:8px;font-size:10px}.progress{display:flex;gap:6px;overflow:auto;padding:16px 0}.p{background:#15191f;color:#89919c;padding:7px 9px;border-radius:20px;font-size:10px;white-space:nowrap}.p.a{background:#d7b56d;color:#111;font-weight:bold}.card{background:#15191f;border:1px solid #2a3038;border-radius:18px;padding:18px}.ey{color:#d7b56d;font-size:11px;font-weight:bold}.title{font-size:23px;font-weight:800;margin:6px 0 12px}.help{color:#a9b0bb;font-size:13px;line-height:1.7}.input{width:100%;min-height:145px;margin:14px 0;padding:13px;background:#0f1318;border:1px solid #363d46;border-radius:12px;color:#fff;font-size:14px}.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#d7b56d;color:#111;font-weight:900;margin-top:14px;font-size:14px}.btn.alt{background:#252b33;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile,.item{background:#101419;border:1px solid #29303a;border-radius:13px;padding:13px}.tile.sel{border-color:#d7b56d}.badge{background:#d7b56d;color:#111;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;margin-bottom:8px}.tile h3,.item h3{font-size:14px;margin:0 0 6px}.price{color:#d7b56d;font-weight:900;font-size:12px;margin-top:7px}.pills{display:grid;gap:8px;margin-top:12px}.pill{background:#101419;border-radius:11px;padding:11px}.pill b{display:block;color:#d7b56d;font-size:10px;margin-bottom:4px}.big{font-size:36px;color:#d7b56d;font-weight:900}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#a9b0bb;font-size:11px;margin-bottom:5px}.field input{width:100%;padding:11px;background:#0f1318;border:1px solid #363d46;border-radius:10px;color:#fff;text-align:center}.ok{margin-top:12px;background:#132119;color:#7ed6a4;border-radius:12px;padding:12px;font-size:12px;font-weight:bold}.warn{color:#929aa5;font-size:10px;line-height:1.7;margin-top:12px}.foot{text-align:center;color:#66707c;font-size:10px;margin-top:22px}
@media(max-width:390px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="app">
<div class="top"><div><div class="brand">DOOR DNA AI</div><div class="sub">من شخصيتك إلى بابك</div></div><div class="demo">WEB DEMO</div></div>
<div id="progress" class="progress"></div><div id="screen"></div>
<div class="foot">V34 • Prototype • لا توجد معاملات مالية حقيقية</div></div>
<script>
const steps=["القصة","DNA","التصميم","المقاس","السعر","الهندسة","المصانع","العروض","الطلب","العقد","الدفع","المتابعة"];
const ds=[["A","Egyptian Minimal","هندسة هادئة مستوحاة من الحضارة المصرية بشكل أصلي.",1850],["B","Legend Line","خطوط رياضية ديناميكية بلمسة فاخرة.",2150],["C","Royal Quiet","فخامة هادئة وتفاصيل قليلة وحضور قوي.",2450]];
let s={i:0,story:"بحب الكورة ومهتم بالحضارة المصرية القديمة. عايز باب فخم وهادي ومختلف.",d:"A",w:100,h:220,b:2500,order:"",paid:false};
const money=n=>Math.round(n).toLocaleString("ar-EG")+" $";
const design=()=>ds.find(x=>x[0]===s.d)||ds[0];
const estimate=()=>Math.round(design()[3]*Math.max(.85,Math.min(1.35,(s.w*s.h)/(100*220))));
function go(i){s.i=Math.max(0,Math.min(11,i));render();scrollTo(0,0)}
function button(t,f,alt=false){return `<button class="btn ${alt?"alt":""}" onclick="${f}">${t}</button>`}
function pill(a,b){return `<div class="pill"><b>${a}</b>${b}</div>`}
function card(e,t,b){return `<div class="card"><div class="ey">${e}</div><div class="title">${t}</div>${b}</div>`}
function render(){
progress.innerHTML=steps.map((x,i)=>`<div class="p ${i===s.i?"a":""}" onclick="go(${i})">${i+1}. ${x}</div>`).join("");
let x="";
if(s.i===0)x=card("01","احكي لنا عنك",`<div class="help">اكتب اهتماماتك وشخصيتك والجو اللي نفسك تشوفه في الباب.</div><textarea id="story" class="input">${s.story}</textarea>${button("حلّل شخصيتي وابدأ","analyze()")}`);
if(s.i===1)x=card("02","Customer DNA",`${pill("الشخصية","واثق • هادئ • يحب المعنى والتفاصيل")}${pill("الهوية","تراث مصري + روح رياضية + فخامة")}${pill("الاتجاه","Minimal • Premium • Original")}${button("اعرض 3 تصاميم أصلية","go(2)")}`);
if(s.i===2)x=card("03","اختار مفهوم الباب",`<div class="grid">${ds.map(d=>`<div class="tile ${s.d===d[0]?"sel":""}" onclick="pick('${d[0]}')"><div class="badge">${d[0]}</div><h3>${d[1]}</h3><div class="help">${d[2]}</div><div class="price">${money(d[3])} تقديري</div></div>`).join("")}</div>${button("تأكيد التصميم والمقاسات","go(3)")}`);
if(s.i===3)x=card("04","المقاسات والميزانية",`<div class="fields"><div class="field"><label>العرض (سم)</label><input id="w" type="number" value="${s.w}"></div><div class="field"><label>الارتفاع (سم)</label><input id="h" type="number" value="${s.h}"></div><div class="field"><label>الميزانية ($)</label><input id="b" type="number" value="${s.b}"></div></div>${button("احسب السعر","dims()")}`);
if(s.i===4)x=card("05","السعر المتوقع",`<div class="big">${money(estimate())}</div><div class="help">تقدير Demo يتغير حسب التصميم والمقاس والخامة والتشطيب.</div>${pill("الميزانية",money(s.b))}${pill("الفرق",money(estimate()-s.b))}${button("فحص هندسي وقابلية تصنيع","go(5)")}`);
if(s.i===5)x=card("06","Engineering & QA",`${pill("الأبعاد",`${s.w} × ${s.h} سم`)}${pill("التصنيع","قابل للتنفيذ مبدئيًا")}${pill("QA","لا توجد تعارضات Demo")}${pill("قبل الإنتاج","اعتماد مصنع حقيقي ورسومات تنفيذية")}${button("مطابقة المصانع","go(6)")}`);
if(s.i===6)x=card("07","Supplier Match",`<div class="pills"><div class="item"><h3>Cairo Premium Doors</h3><div class="price">94% تطابق</div></div><div class="item"><h3>Nile Metal & Wood</h3><div class="price">89% تطابق</div></div><div class="item"><h3>Royal Craft Factory</h3><div class="price">86% تطابق</div></div></div><div class="warn">الأسماء بيانات Demo وليست مصانع متعاقدًا معها.</div>${button("إنشاء RFQ ومقارنة العروض","go(7)")}`);
if(s.i===7)x=card("08","العروض",`<div class="pills"><div class="item"><h3>Cairo Premium Doors</h3><div class="help">21 يوم • ضمان 24 شهر</div><div class="price">1,980 $</div></div><div class="item"><h3>Nile Metal & Wood</h3><div class="help">18 يوم • ضمان 18 شهر</div><div class="price">2,120 $</div></div><div class="item"><h3>Royal Craft Factory</h3><div class="help">25 يوم • ضمان 36 شهر</div><div class="price">2,290 $</div></div></div>${button("اختيار العرض وإنشاء الطلب","order()")}`);
if(s.i===8)x=card("09","Order",`<div class="big">${s.order}</div><div class="help">تم ربط الطلب بالتصميم والمقاسات والعرض.</div>${button("التالي: العقد","go(9)")}`);
if(s.i===9)x=card("10","العقد",`${pill("الحالة","مسودة جاهزة للمراجعة")}${pill("النطاق","تصنيع + تشطيب + تسليم")}${pill("الحصرية والملكية","تحتاج شروطًا قانونية منفصلة")}${button("موافقة Demo والانتقال للدفع","go(10)")}`);
if(s.i===10)x=card("11","الدفع التجريبي",`<div class="big">${money(estimate())}</div><div class="help">لا يتم تحصيل أموال حقيقية في هذه النسخة.</div>${button("تنفيذ دفعة Demo","pay()")}`);
if(s.i===11)x=card("12","حالة المشروع",`${pill("رقم المشروع",s.order||"DDA-DEMO")}${pill("التصميم",design()[1])}${pill("الدفع",s.paid?"Demo Paid":"Pending")}${pill("التالي","مصنع حقيقي → اعتماد → إنتاج")}${s.paid?'<div class="ok">✓ تم تسجيل العملية التجريبية بنجاح — بدون تحصيل مالي.</div>':""}${button("ابدأ مشروع جديد","reset()",true)}`);
screen.innerHTML=x;
}
function analyze(){s.story=document.getElementById("story").value||s.story;go(1)}
function pick(d){s.d=d;render()}
function dims(){s.w=+document.getElementById("w").value||100;s.h=+document.getElementById("h").value||220;s.b=+document.getElementById("b").value||2500;go(4)}
function order(){s.order="DDA-"+Math.random().toString(36).slice(2,8).toUpperCase();go(8)}
function pay(){s.paid=true;go(11)}
function reset(){s={i:0,story:"",d:"A",w:100,h:220,b:2500,order:"",paid:false};render()}
render();
</script></body></html>
