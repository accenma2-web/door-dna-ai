<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>Door DNA AI — V36</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d10;color:#f8f8f5;font-family:Arial,Tahoma,sans-serif}
.app{max-width:620px;margin:auto;padding:18px 15px 38px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.brand{color:#d7b56d;font-size:22px;font-weight:900;letter-spacing:2px}
.sub{color:#a9b0bb;font-size:11px;margin-top:4px}
.demo{border:1px solid #d7b56d;color:#d7b56d;padding:5px 9px;border-radius:8px;font-size:10px;white-space:nowrap}
.progress{display:flex;gap:6px;overflow:auto;padding:16px 0 12px;scrollbar-width:none}
.progress::-webkit-scrollbar{display:none}
.p{background:#15191f;color:#89919c;padding:7px 9px;border-radius:20px;font-size:10px;white-space:nowrap}
.p.a{background:#d7b56d;color:#111;font-weight:bold}
.p.done{color:#ddd;border:1px solid #343b44}
.card{background:#15191f;border:1px solid #2a3038;border-radius:18px;padding:18px}
.ey{color:#d7b56d;font-size:11px;font-weight:bold}
.title{font-size:23px;font-weight:800;margin:6px 0 12px}
.help{color:#a9b0bb;font-size:13px;line-height:1.75}
.note{background:#101419;border:1px solid #29303a;border-radius:12px;padding:11px;margin-top:12px;color:#a9b0bb;font-size:11px;line-height:1.7}
.input{width:100%;min-height:155px;margin:14px 0;padding:13px;background:#0f1318;border:1px solid #363d46;border-radius:12px;color:#fff;font-size:14px;line-height:1.7;resize:vertical}
.btn{width:100%;padding:14px;border:0;border-radius:12px;background:#d7b56d;color:#111;font-weight:900;margin-top:14px;font-size:14px;cursor:pointer}
.btn.alt{background:#252b33;color:#fff}
.btn.ghost{background:transparent;color:#d7b56d;border:1px solid #3a414b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions .btn{margin-top:12px}
.dna{display:grid;gap:9px}
.pill{background:#101419;border-radius:11px;padding:11px}
.pill b{display:block;color:#d7b56d;font-size:10px;margin-bottom:5px}
.tag{display:inline-block;background:#252b33;color:#ddd;border-radius:20px;padding:6px 9px;margin:3px;font-size:10px}
.meter{height:7px;background:#252b33;border-radius:10px;overflow:hidden;margin-top:7px}
.meter i{display:block;height:100%;background:#d7b56d;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.tile{background:#101419;border:1px solid #29303a;border-radius:15px;padding:12px;cursor:pointer}
.tile.sel{border-color:#d7b56d;box-shadow:0 0 0 1px #d7b56d inset}
.tile h3{font-size:15px;margin:0 0 6px}
.tile .why{color:#c8cbd0;font-size:11px;line-height:1.6;margin-top:7px}
.price{color:#d7b56d;font-weight:900;font-size:12px;margin-top:7px}
.badge{display:inline-block;font-size:9px;padding:4px 7px;border-radius:20px;background:#252b33;color:#ddd;margin-bottom:7px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;color:#a9b0bb;font-size:11px;margin-bottom:5px}
.field input{width:100%;padding:12px;background:#0f1318;border:1px solid #363d46;border-radius:10px;color:#fff;text-align:center}
.big{font-size:36px;color:#d7b56d;font-weight:900}
.compare{display:grid;gap:8px;margin-top:12px}
.compare .row{background:#101419;border-radius:11px;padding:11px}
.ok{margin-top:12px;background:#132119;color:#7ed6a4;border-radius:12px;padding:12px;font-size:12px;font-weight:bold}
.warn{color:#929aa5;font-size:10px;line-height:1.7;margin-top:12px}
.foot{text-align:center;color:#66707c;font-size:10px;margin-top:22px}
.doorbox{height:155px;border-radius:10px 10px 4px 4px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid #5c626b;background:#1c2026}
.door{width:82px;height:138px;border:3px solid #d7b56d;border-radius:4px 4px 1px 1px;position:relative;box-shadow:0 10px 30px #0008}
.door:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#d7b56d;right:9px;top:68px}
.egypt .door{background:linear-gradient(90deg,#24262a 0 40%,#c9a65b 41% 45%,#24262a 46% 100%)}
.legend .door{background:repeating-linear-gradient(135deg,#171a1e 0 13px,#30343a 14px 18px)}
.royal .door{background:radial-gradient(circle at 50% 30%,#3a3426 0 10%,#171a1e 11% 100%)}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.spec{background:#101419;border-radius:10px;padding:10px;font-size:11px;color:#c9ccd1}
.spec b{display:block;color:#d7b56d;font-size:10px;margin-bottom:4px}
@media(max-width:390px){.fields,.specs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div><div class="brand">DOOR DNA AI</div><div class="sub">من شخصيتك إلى بابك</div></div>
    <div class="demo">WEB DEMO • V36</div>
  </div>
  <div id="progress" class="progress"></div>
  <div id="screen"></div>
  <div class="foot">V36 • Prototype • لا توجد معاملات مالية حقيقية • بيانات المصانع والأسعار Demo</div>
</div>

<script>
const steps=["القصة","DNA","التصميم","المقاس","السعر","الهندسة","المصانع","العروض","الطلب","العقد","الدفع","المتابعة"];

const ds=[
 {id:"A",name:"Egyptian Minimal",price:1850,kind:"egypt",style:"Minimal فاخر",traits:["هدوء بصري","هوية مصرية","خطوط هندسية"],desc:"خطوط نظيفة ولمسة مستوحاة من الهوية المصرية بدون زخرفة زائدة."},
 {id:"B",name:"Legend Line",price:2150,kind:"legend",style:"مودرن رياضي",traits:["طاقة","حضور قوي","خطوط ديناميكية"],desc:"تكوين أقوى وحركة بصرية مناسبة للشخصية الرياضية والطموحة."},
 {id:"C",name:"Royal Quiet",price:2450,kind:"royal",style:"فخامة هادئة",traits:["خصوصية","هيبة","Minimal Premium"],desc:"فخامة هادئة وتفاصيل قليلة مع حضور قوي ومظهر راقٍ."}
];

let s={
 i:0,story:"",
 dna:{style:"هادئ وعصري",tags:["شخصية واثقة","هوية خاصة"],scores:[0,0,0],summary:""},
 d:"A",w:100,h:220,b:2500,order:"",paid:false
};

const money=n=>Math.round(Number(n)||0).toLocaleString("ar-EG")+" $";
const design=()=>ds.find(x=>x.id===s.d)||ds[0];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

function button(t,f,alt=false,disabled=false){
 return `<button class="btn ${alt?"alt":""}" ${disabled?"disabled":""} onclick="${f}">${t}</button>`;
}
function pill(a,b){return `<div class="pill"><b>${a}</b>${b}</div>`}
function card(e,t,b){return `<div class="card"><div class="ey">${e}</div><div class="title">${t}</div>${b}</div>`}

function canGo(target){
 return target<=s.i || target===s.i+1;
}

function go(i){
 i=Math.max(0,Math.min(11,Number(i)||0));
 if(i>s.i+1){return;}
 s.i=i; render(); window.scrollTo(0,0);
}

function back(){
 if(s.i>0){s.i--;render();window.scrollTo(0,0);}
}

function render(){
 document.getElementById("progress").innerHTML=steps.map((x,i)=>{
   const cls=i===s.i?"a":(i<s.i?"done":"");
   return `<div class="p ${cls}" ${i<=s.i?'onclick="go('+i+')"':''}>${i+1}. ${x}</div>`;
 }).join("");

 let x="";
 if(s.i===0){
   x=card("01","احكي لنا عنك",
    `<div class="help">اكتب شخصيتك واهتماماتك والجو اللي نفسك تشوفه في الباب. كلما وصفت نفسك أكتر، كلما كان التحليل التجريبي أدق.</div>
     <textarea id="story" class="input" placeholder="مثال: أنا بحب الهدوء والفخامة، مهتم بالحضارة المصرية وبحب الرياضة، وعايز باب مختلف بس مش مبالغ فيه">${esc(s.story)}</textarea>
     ${button("حلّل شخصيتي وابدأ","analyze()")}
     <div class="note">ملاحظة: تحليل V36 داخل المتصفح تجريبي Rule-based. عند ربط الـBackend لاحقًا يمكن استبداله بتحليل AI حقيقي بدون وضع مفتاح API داخل الموقع.</div>`);
 }
 if(s.i===1){
   const scoreHtml=s.dna.scores.map((v,i)=>`<div class="pill"><b>${["Egyptian Minimal","Legend Line","Royal Quiet"][i]}</b><div class="meter"><i style="width:${Math.max(8,v)}%"></i></div><div class="help">${v}% توافق مبدئي</div></div>`).join("");
   x=card("02","DNA شخصيتك",
    `<div class="dna">
      ${pill("الأسلوب",esc(s.dna.style))}
      ${pill("سمات الشخصية",s.dna.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(""))}
      ${pill("ملخص",esc(s.dna.summary))}
      ${pill("ترشيح مبدئي",`التصميمات الثلاثة ستظهر بالترتيب، وإنت صاحب القرار النهائي.`)}
      ${scoreHtml}
    </div>
    <div class="actions">${button("رجوع","back()",true)}${button("اعرض 3 تصاميم أصلية","go(2)")}</div>`);
 }
 if(s.i===2){
   x=card("03","اختار مفهوم الباب",
    `<div class="help">مش هنفرض عليك تصميم تلقائي. دي 3 مفاهيم مبنية على الـDNA، والاختيار النهائي بتاعك.</div>
     <div class="grid" style="margin-top:12px">${ds.map((d,idx)=>{
       const score=s.dna.scores[idx];
       return `<div class="tile ${s.d===d.id?"sel":""}" onclick="pick('${d.id}')">
         <span class="badge">${score}% توافق مبدئي</span>
         <div class="doorbox ${d.kind}"><div class="door"></div></div>
         <h3>${d.name}</h3><div class="help">${d.desc}</div>
         <div class="why">الطابع: ${d.style}<br>${d.traits.join(" • ")}</div>
         <div class="price">${money(d.price)} تقديري</div>
       </div>`;
     }).join("")}</div>
     <div class="actions">${button("رجوع","back()",true)}${button("تأكيد التصميم والمقاسات","go(3)")}</div>`);
 }
 if(s.i===3){
   x=card("04","المقاسات والميزانية",
    `<div class="help">أدخل المقاس التقريبي والميزانية. السعر التالي تقديري فقط.</div>
     <div class="fields" style="margin-top:14px">
       <div class="field"><label>العرض (سم)</label><input id="w" type="number" min="50" max="250" value="${s.w}"></div>
       <div class="field"><label>الارتفاع (سم)</label><input id="h" type="number" min="100" max="350" value="${s.h}"></div>
       <div class="field"><label>الميزانية ($)</label><input id="b" type="number" min="0" value="${s.b}"></div>
     </div>
     <div class="note">المقاس النهائي والتسعير النهائي يحتاجان مراجعة مصنع ورسومات تنفيذية.</div>
     <div class="actions">${button("رجوع","back()",true)}${button("احسب السعر","dims()")}</div>`);
 }
 if(s.i===4){
   const est=estimate();
   x=card("05","السعر المتوقع",
    `<div class="big">${money(est)}</div>
     <div class="help">التقدير يتغير حسب التصميم والمقاس. العملة هنا Demo بالدولار.</div>
     ${pill("التصميم",design().name)}
     ${pill("الميزانية",money(s.b))}
     ${pill("الفرق",money(est-s.b))}
     ${button("رجوع","back()",true)}
     ${button("فحص هندسي وقابلية تصنيع","go(5)")}`);
 }
 if(s.i===5){
   x=card("06","الهندسة و QA",
    `${pill("الأبعاد",`${s.w} × ${s.h} سم`)}
     ${pill("التصنيع","قابل للتنفيذ مبدئيًا")}
     ${pill("QA","لا توجد تعارضات واضحة في بيانات Demo")}
     <div class="specs">
       <div class="spec"><b>الخامة المقترحة</b>حسب اعتماد المصنع</div>
       <div class="spec"><b>التشطيب</b>Premium حسب العرض</div>
       <div class="spec"><b>رسومات تنفيذية</b>مطلوبة قبل الإنتاج</div>
       <div class="spec"><b>اعتماد نهائي</b>مصنع حقيقي + عينة</div>
     </div>
     <div class="actions">${button("رجوع","back()",true)}${button("مطابقة المصانع","go(6)")}</div>`);
 }
 if(s.i===6){
   x=card("07","مطابقة المصانع",
    `<div class="compare">
      <div class="row"><b>Cairo Premium Doors</b><br><span class="help">94% توافق مبدئي</span></div>
      <div class="row"><b>Nile Metal & Wood</b><br><span class="help">89% توافق مبدئي</span></div>
      <div class="row"><b>Royal Craft Factory</b><br><span class="help">86% توافق مبدئي</span></div>
     </div>
     <div class="warn">الأسماء ونِسَب التطابق بيانات Demo وليست مصانع متعاقدًا معها حاليًا.</div>
     <div class="actions">${button("رجوع","back()",true)}${button("إنشاء RFQ ومقارنة العروض","go(7)")}</div>`);
 }
 if(s.i===7){
   x=card("08","العروض",
    `<div class="compare">
      <div class="row"><b>Cairo Premium Doors</b><br><span class="help">21 يوم • ضمان 24 شهر</span><div class="price">1,980 $</div></div>
      <div class="row"><b>Nile Metal & Wood</b><br><span class="help">18 يوم • ضمان 18 شهر</span><div class="price">2,120 $</div></div>
      <div class="row"><b>Royal Craft Factory</b><br><span class="help">25 يوم • ضمان 36 شهر</span><div class="price">2,290 $</div></div>
     </div>
     <div class="warn">كل الأسعار والعروض هنا تجريبية فقط.</div>
     <div class="actions">${button("رجوع","back()",true)}${button("اختيار العرض وإنشاء الطلب","order()")}</div>`);
 }
 if(s.i===8){
   x=card("09","الطلب",
    `<div class="big">${esc(s.order)}</div>
     ${pill("التصميم",design().name)}
     ${pill("المقاس",`${s.w} × ${s.h} سم`)}
     ${pill("الحالة","Demo — جاهز للمراجعة")}
     <div class="actions">${button("رجوع","back()",true)}${button("التالي: العقد","go(9)")}</div>`);
 }
 if(s.i===9){
   x=card("10","العقد",
    `${pill("الحالة","مسودة جاهزة للمراجعة")}
     ${pill("النطاق","تصنيع + تشطيب + تسليم")}
     ${pill("الحصرية والملكية","تحتاج شروطًا قانونية وعقودًا منفصلة")}
     <div class="note">النسخة الحالية لا تنشئ عقدًا قانونيًا ولا تمنح حصرية فعلية. الهدف هنا عرض رحلة المنتج.</div>
     <div class="actions">${button("رجوع","back()",true)}${button("موافقة Demo والانتقال للدفع","go(10)")}</div>`);
 }
 if(s.i===10){
   x=card("11","الدفع التجريبي",
    `<div class="big">${money(estimate())}</div>
     <div class="help">لا يتم تحصيل أموال حقيقية في هذه النسخة.</div>
     <div class="note">في الإنتاج الحقيقي سيتم استبدال هذه الخطوة ببوابة دفع آمنة مرتبطة بالـBackend.</div>
     <div class="actions">${button("رجوع","back()",true)}${button("تنفيذ دفعة Demo","pay()")}</div>`);
 }
 if(s.i===11){
   x=card("12","حالة المشروع",
    `${pill("رقم المشروع",esc(s.order||"DDA-DEMO"))}
     ${pill("التصميم",design().name)}
     ${pill("الدفع",s.paid?"Demo Paid":"Pending")}
     ${pill("التالي","اعتماد مصنع حقيقي → رسومات تنفيذية → إنتاج")}
     ${s.paid?'<div class="ok">✓ تم تسجيل العملية التجريبية بنجاح — بدون تحصيل مالي.</div>':""}
     ${button("ابدأ مشروع جديد","reset()",true)}`);
 }
 document.getElementById("screen").innerHTML=x;
}

function analyze(){
 s.story=document.getElementById("story").value.trim()||"شخصية هادئة وفخمة";
 const q=s.story.toLowerCase();
 let tags=["شخصية واثقة","هوية خاصة"];
 let scores=[45,45,45];

 const has=(...words)=>words.some(w=>q.includes(w));
 if(has("فخم","فاخر","راقي","رفاهية","luxury")){tags.push("فخامة هادئة");scores[2]+=25;scores[0]+=15;}
 if(has("بسيط","هادئ","minimal","مينيمال","نظيف")){tags.push("هدوء بصري");scores[0]+=25;scores[2]+=20;}
 if(has("رياض","كورة","كرة","جيم","ميسي","رونالدو","سبورت")){tags.push("روح رياضية");scores[1]+=30;}
 if(has("مصر","مصري","فرعون","حضارة","أهرام","أثر")){tags.push("هوية مصرية");scores[0]+=35;}
 if(has("قوي","جريء","ديناميكي","مميز","مختلف")){tags.push("حضور قوي");scores[1]+=20;scores[2]+=10;}
 if(has("خصوصية","هادئ","خصوصي")){tags.push("خصوصية وأناقة");scores[2]+=20;}
 scores=scores.map(v=>Math.min(98,v));
 const max=Math.max(...scores), idx=scores.indexOf(max);
 const styles=["Minimal فاخر","مودرن رياضي","فخامة هادئة"];
 const summaries=[
   "تميل لخطوط نظيفة وهوية واضحة وتفاصيل محسوبة بدون زحمة.",
   "تميل للحركة والحضور القوي مع لمسة عصرية فاخرة.",
   "تميل للفخامة الهادئة والخصوصية والتفاصيل القليلة."
 ];
 s.dna={
   style:styles[idx],
   tags:[...new Set(tags)].slice(0,6),
   scores,
   summary:summaries[idx]
 };
 /* مهم: لا نفرض التصميم. نستخدم أعلى نتيجة كترشيح بصري فقط. */
 s.d=ds[idx].id;
 go(1);
}

function pick(id){
 if(ds.some(d=>d.id===id)){s.d=id;render();}
}

function dims(){
 const w=Number(document.getElementById("w").value)||100;
 const h=Number(document.getElementById("h").value)||220;
 const b=Number(document.getElementById("b").value)||0;
 s.w=Math.max(50,Math.min(250,w));
 s.h=Math.max(100,Math.min(350,h));
 s.b=Math.max(0,b);
 go(4);
}

function estimate(){
 const base=design().price;
 const factor=Math.max(.85,Math.min(1.35,(s.w*s.h)/(100*220)));
 return Math.round(base*factor);
}

function order(){
 s.order="DDA-"+Math.random().toString(36).slice(2,8).toUpperCase();
 go(8);
}

function pay(){
 s.paid=true;go(11);
}

function reset(){
 s={i:0,story:"",dna:{style:"هادئ وعصري",tags:["شخصية واثقة","هوية خاصة"],scores:[45,45,45],summary:""},d:"A",w:100,h:220,b:2500,order:"",paid:false};
 render();window.scrollTo(0,0);
}

render();
</script>
</body>
</html>
