t(circle at 75% 15%,#2c2414 0,#13171d 42%,#0b0e12 100%);border:1px solid #3a3223;border-radius:18px;padding:19px;margin-bottom:13px}.hero h1{font-size:29px;margin:5px 0 8px}.gold{color:#d7b56d}.dnaGrid,.grid,.specs,.editgrid{display:grid;gap:10px}.dnaGrid{grid-template-columns:1fr 1fr}.pill{background:#0e1217;border:1px solid #262d35;border-radius:13px;padding:11px}.pill b{display:block;color:#d7b56d;font-size:10px;margin-bottom:5px}.meter{height:7px;background:#252b33;border-radius:10px;overflow:hidden;margin-top:7px}.meter i{display:block;height:100%;background:#d7b56d;border-radius:10px}.grid{grid-template-columns:1fr}.tile{background:#0e1217;border:1px solid #29303a;border-radius:16px;padding:12px;cursor:pointer}.tile.sel{border-color:#d7b56d;box-shadow:0 0 0 1px #d7b56d inset}.tile h3{font-size:16px;margin:0 0 6px}.badge{display:inline-block;font-size:9px;padding:4px 7px;border-radius:20px;background:#242a32;color:#ddd;margin-bottom:7px}.why{color:#c8cbd0;font-size:11px;line-height:1.65;margin-top:7px}.price{color:#d7b56d;font-weight:900;font-size:12px;margin-top:7px}.doorbox{height:175px;border-radius:12px;margin-bottom:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid #4a5058;background:radial-gradient(circle at 50% 25%,#30343a,#12161b 65%)}.door{width:92px;height:151px;border:3px solid #d7b56d;border-radius:5px 5px 1px 1px;position:relative;box-shadow:0 15px 38px #0009}.door:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#d7b56d;right:10px;top:73px}.egypt .door{background:linear-gradient(90deg,#25272a 0 38%,#c9a65b 39% 44%,#25272a 45% 100%)}.legend .door{background:repeating-linear-gradient(135deg,#171a1e 0 13px,#30343a 14px 18px)}.royal .door{background:radial-gradient(circle at 50% 27%,#403724 0 11%,#171a1e 12% 100%)}.editgrid{grid-template-columns:1fr 1fr}.select,.range{width:100%;padding:11px;background:#0e1217;border:1px solid #343b45;border-radius:10px;color:#fff}.range{padding:0}.field label{display:block;color:#aeb4bd;font-size:10px;margin-bottom:5px}.preview{min-height:230px;border:1px solid #343b45;border-radius:15px;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#24272b,#0e1115);position:relative;overflow:hidden}.preview .door{transition:.2s}.preview .door.round{border-radius:24px 24px 3px 3px}.preview .door.line{background:repeating-linear-gradient(90deg,#171a1e 0 10px,#a7884c 11px 13px)}.approval{border:1px solid #6d5931;background:#16140f;border-radius:14px;padding:13px;margin-top:12px}.big{font-size:35px;color:#d7b56d;font-weight:900}.compare{display:grid;gap:8px}.compare .row{background:#0e1217;border-radius:12px;padding:12px}.ok{margin-top:12px;background:#132119;color:#7ed6a4;border-radius:12px;padding:12px;font-size:12px;font-weight:bold}.warn{color:#8e97a3;font-size:10px;line-height:1.7;margin-top:12px}.foot{text-align:center;color:#626b76;font-size:9px;margin-top:22px}.upload{display:block;width:100%;padding:12px;background:#0e1217;border:1px dashed #5a4b2e;border-radius:12px;color:#d7b56d;text-align:center;cursor:pointer;font-size:11px}.upload input{display:none}.homePreview{display:none;width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-top:10px}.tagline{color:#aeb4bd;font-size:11px}.stepsMini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.stepsMini span{border:1px solid #303741;border-radius:20px;padding:6px 8px;font-size:9px;color:#c4c9d0}@media(max-width:460px){.dnaGrid,.editgrid{grid-template-columns:1fr}.hero h1{font-size:25px}}

<body>
<div class="app">
  <div class="top"><div><div class="brand">DOOR DNA AI</div><div class="sub">من شخصيتك إلى هوية مدخلك</div></div><div class="demo">LUXURY EXPERIENCE • V37 FINAL</div></div>
  <div id="progress" class="progress"></div><div id="screen"></div>
  <div class="foot">V37 Final Prototype • لا توجد معاملات مالية حقيقية • المصانع والأسعار والدفع Demo</div>
</div>
<script>
const steps=['البداية','العقار','القصة','DNA','التصميم','التعديل','المعاينة','المقاس','السعر','الهندسة','المصانع','العروض','الاعتماد','الطلب','العقد','الدفع','المتابعة'];
const ds=[
{id:'A',name:'Egyptian Minimal',price:1850,kind:'egypt',style:'Minimal فاخر',traits:['هدوء بصري','هوية مصرية','هندسة نظيفة'],desc:'لغة هندسية هادئة تستلهم النسب والظل والضوء من التراث المصري بدون زخرفة سياحية.'},
{id:'B',name:'Legend Line',price:2150,kind:'legend',style:'مودرن جريء',traits:['حضور','حركة بصرية','ثقة'],desc:'خطوط ديناميكية وحضور أقوى لمن يحب التعبير الواضح والطابع العصري.'},
{id:'C',name:'Royal Quiet',price:2450,kind:'royal',style:'فخامة هادئة',traits:['هيبة','خصوصية','Minimal Premium'],desc:'كتلة راقية وتفاصيل قليلة، مصممة لتعطي إحساسًا بالفخامة من غير استعراض.'}
];
let s={i:0,property:'فيلا',story:'',dna:{style:'بانتظار التحليل',summary:'',tags:[],scores:[45,45,45],confidence:0},d:'C',finish:'أسود فاخر',accent:'ذهبي هادئ',heritage:'هندسة مصرية معاصرة',privacy:60,bold:45,w:110,h:240,b:5000,order:'',paid:false,home:null,version:1,customEdit:'',factory:'',offer:'',offerPrice:0};
const money=n=>Math.round(Number(n)||0).toLocaleString('ar-EG')+' $';
const design=()=>ds.find(x=>x.id===s.d)||ds[2];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function button(t,f,alt){return '<button class="btn '+(alt?'alt':'')+'" onclick="'+f+'">'+t+'</button>'}
function pill(a,b){return '<div class="pill"><b>'+a+'</b>'+b+'</div>'}
function card(e,t,b){return '<div class="card"><div class="ey">'+e+'</div><div class="title">'+t+'</div>'+b+'</div>'}
function go(i){i=Number(i);if(i>s.i+1)return;s.i=Math.max(0,Math.min(16,i));render();scrollTo(0,0)}
function back(){if(s.i>0){s.i--;render();scrollTo(0,0)}}
function analyze(){
 s.story=(document.getElementById('story').value||'').trim()||'أحب الهدوء والبساطة والفخامة وأريد مدخلًا يعبر عني';
 const q=s.story.toLowerCase(),has=function(){const w=[...arguments];return w.some(x=>q.includes(x))};
 const calm=has('هدوء','هادئ','بسيط','بساطة','minimal','نظيف')?86:42;
 const luxury=has('فخم','فخامة','فاخر','راقي','رفاهية','luxury')?86:44;
 const bold=has('جريء','قوي','حضور','ديناميكي','طموح','هيبة')?74:40;
 const sport=has('رياضة','رياضي','كورة','كرة','جيم','سبورت','ميسي','رونالدو')?88:22;
 const heritage=has('مصر','مصري','فرعون','حضارة','أهرام','تراث','أثر')?90:25;
 const tech=has('تكنولوجيا','تقنية','ذكي','ذكاء','tech','رقمي')?78:30;
 const privacy=has('خصوصية','خصوصي','أمان','منعزل','مغلق')?80:48;
 let scores=[Math.round(calm*.40+heritage*.25+tech*.10+privacy*.15+luxury*.10),Math.round(bold*.28+sport*.34+tech*.16+luxury*.14+calm*.08),Math.round(luxury*.40+calm*.27+privacy*.23+bold*.06+tech*.04)];
 scores=scores.map(v=>Math.max(20,Math.min(97,v)));
 const idx=scores.indexOf(Math.max(...scores));
 const tags=[];if(calm>60)tags.push('هدوء وبساطة');if(luxury>60)tags.push('ذوق فاخر');if(bold>60)tags.push('تعبير واثق');if(tech>60)tags.push('عقلية معاصرة');if(heritage>60)tags.push('ارتباط بالهوية');if(privacy>60)tags.push('خصوصية');if(sport>60)tags.push('طاقة رياضية');
 const summary='أنت تميل إلى '+(calm>60?'الهدوء والوضوح':'التعبير المباشر')+' مع '+(luxury>60?'ذوق فاخر محسوب':'تفضيل عملي')+'. أسلوبك في التعبير '+(bold>60?'واضح وواثق':'متزن وهادئ')+'.';
 s.dna={style:['Minimal فاخر','مودرن جريء','فخامة هادئة'][idx],summary:summary,tags:tags.slice(0,7),scores:scores,confidence:Math.min(96,60+tags.length*5),calm:calm,luxury:luxury,bold:bold,sport:sport,heritage:heritage,tech:tech,privacy:privacy};
 s.d=ds[idx].id;s.privacy=privacy;s.bold=bold;go(3)
}
function pick(id){if(ds.some(x=>x.id===id)){s.d=id;render()}}
function updateDesign(){
 s.finish=document.getElementById('finish').value;
 s.accent=document.getElementById('accent').value;
 s.heritage=document.getElementById('heritage').value;
 s.customEdit=(document.getElementById('customEdit')?.value||'').trim();
 s.privacy=Number(document.getElementById('privacy')?.value||s.privacy);
 s.bold=Number(document.getElementById('bold')?.value||s.bold);
 s.version++;
 go(6);
}
function dims(){s.w=Math.max(60,Math.min(500,Number(document.getElementById('w').value)||110));s.h=Math.max(120,Math.min(500,Number(document.getElementById('h').value)||240));s.b=Math.max(0,Number(document.getElementById('b').value)||0);go(8)}
function estimate(){const base=design().price;const factor=Math.max(.8,Math.min(2.4,(s.w*s.h)/(110*240)));const premium=1+(s.bold/100)*.18+(s.privacy/100)*.10;return Math.round(base*factor*premium)}
function selectFactory(name){s.factory=name;s.offer='';s.offerPrice=0;render()}
function selectOffer(name,price){s.offer=name;s.offerPrice=Number(price)||0;render()}
function approve(){s.order='DDA-'+Math.random().toString(36).slice(2,8).toUpperCase();go(13)}
function pay(){s.paid=true;go(16)}
function showHome(input){const f=input.files&&input.files[0];if(!f)return;const r=new FileReader();r.onload=function(e){s.home=e.target.result;render()};r.readAsDataURL(f)}
function reset(){s={i:0,property:'فيلا',story:'',dna:{style:'بانتظار التحليل',summary:'',tags:[],scores:[45,45,45],confidence:0},d:'C',finish:'أسود فاخر',accent:'ذهبي هادئ',heritage:'هندسة مصرية معاصرة',privacy:60,bold:45,w:110,h:240,b:5000,order:'',paid:false,home:null,version:1,customEdit:'',factory:'',offer:'',offerPrice:0};render();scrollTo(0,0)}
function render(){
 document.getElementById('progress').innerHTML=steps.map(function(x,i){return '<div class="p '+(i===s.i?'a':i<s.i?'done':'')+'" '+(i<=s.i?'onclick="go('+i+')"':'')+'>'+(i+1)+'. '+x+'</div>'}).join('');
 let x='';
 if(s.i===0){x='<div class="hero"><div class="ey">DOOR DNA AI</div><h1>الباب مش مجرد مدخل…<br><span class="gold">الباب بيحكي عن صاحبه.</span></h1><div class="quote">من الحضارات القديمة، كان المدخل جزءًا من هوية المكان. وإحنا بنقرأ هويتك ونحوّلها إلى مدخل يحمل الـDNA الخاص بك.</div><div class="help">من باب منزل بسيط إلى بوابة فيلا أو قصر، نفس الفكرة تتوسع حسب شخصيتك، عقارك، مستوى الخصوصية، والميزانية.</div><div class="stepsMini"><span>DNA شخصي</span><span>AI Design</span><span>Interactive Editing</span><span>Visualization</span><span>Manufacturing</span></div>'+button('ابدأ رحلتك','go(1)')+'</div>'}
 if(s.i===1){let props=['شقة','منزل','فيلا','فيلا فاخرة','قصر / Estate','مشروع تجاري راقٍ'];let ph=props.map(function(p){return '<div class="tile '+(s.property===p?'sel':'')+'" data-property="'+esc(p)+'"><h3>'+esc(p)+'</h3><div class="why">'+((p.includes('قصر')||p.includes('فيلا'))?'تجربة Luxury تشمل الأبواب والبوابات حسب الحاجة.':'تصميم باب شخصي مبني على الـDNA.')+'</div></div>'}).join('');x=card('01','إيه نوع العقار?','<div class="help">التصميم هيتغير حسب حجم وطبيعة العقار. كل الفئات تقدر تستخدم المنصة، لكن الفيلات والقصور تحصل على تجربة مداخل أوسع.</div><div class="grid" style="margin-top:13px">'+ph+'</div><div class="actions">'+button('رجوع','back()',true)+button('احكي عن نفسك','go(2)')+'</div>')}
 if(s.i===2){x=card('02','احكي لنا عنك','<div class="help">اكتب بطريقتك. الـAI لا يبحث عن كلمات جميلة فقط؛ بل يحوّل قصتك إلى قرارات تصميم ملموسة: شكل، خطوط، خامات، ألوان، إضاءة، درجة انفتاح، وحجم حضور المدخل.</div><textarea id="story" class="input" placeholder="مثال: بحب الهدوء والبساطة، لكن بحب الفخامة والتفاصيل المميزة. مهتم بالتكنولوجيا والسفر، وعايز مدخل أنيق يعبر عن شخصيتي من غير زحمة أو مبالغة.">'+esc(s.story)+'</textarea>'+button('حلّل شخصيتي وحوّل قصتي لتصميم','analyze()')+'<div class="note"><b>إيه اللي هيحصل؟</b><br>قصتك → فهم شخصيتك → لغة بصرية → خامات وتفاصيل → تصميم باب أو بوابة مناسب لعقارك.</div><div class="note">التحليل في V37 تجريبي محلي داخل المتصفح؛ المنتج الحقيقي يستخدم Backend AI لتوليد تصميمات ومواصفات أكثر دقة.</div>'+button('رجوع','back()',true))}
 if(s.i===3){let scores=ds.map(function(d,i){return '<div class="pill"><b>'+d.name+'</b><div class="meter"><i style="width:'+s.dna.scores[i]+'%"></i></div><div class="help">'+s.dna.scores[i]+'% توافق مبدئي</div></div>'}).join('');let tags=s.dna.tags.map(function(t){return '<span class="chip">'+esc(t)+'</span>'}).join('');x=card('03','DNA Profile — هويتك','<div class="hero"><div class="ey">YOUR DNA STYLE</div><div class="title">'+esc(s.dna.style)+'</div><div class="help">درجة ثقة التحليل التجريبي: '+s.dna.confidence+'%</div></div><div class="approval"><b>كيف تحولت قصتك إلى تصميم؟</b><div class="help" style="margin-top:6px">'+(s.dna.calm>65?'خطوط هادئة ونظيفة • ':'')+(s.dna.luxury>65?'خامات فاخرة وتفاصيل محسوبة • ':'')+(s.dna.tech>65?'تفاصيل تقنية أو إضاءة مخفية • ':'')+(s.dna.heritage>65?'هندسة مصرية معاصرة مستوحاة من النِّسب والظل والضوء • ':'')+(s.dna.sport>65?'خطوط أكثر حركة وديناميكية • ':'')+'نِسب وألوان متوافقة مع العقار.'+'</div></div><div class="dnaGrid">'+pill('طريقة الشخصية',s.dna.tags.includes('تعبير واثق')?'واضحة وواثقة':'متزنة وهادئة')+pill('الذوق البصري',s.dna.tags.includes('هدوء وبساطة')?'نظيف وهادئ':'تعبيري')+pill('العلاقة بالهوية',s.dna.tags.includes('ارتباط بالهوية')?'مرتبطة بالهوية والثقافة':'هوية شخصية معاصرة')+pill('البيئة المناسبة',s.dna.tags.includes('خصوصية')?'راقية وهادئة وخصوصية عالية':'راقية ومنفتحة بصريًا')+'</div>'+pill('سماتك',tags)+pill('قراءة AI',esc(s.dna.summary))+scores+'<div class="actions">'+button('رجوع','back()',true)+button('صمّم لي 3 مفاهيم','go(4)')+'</div>')}
